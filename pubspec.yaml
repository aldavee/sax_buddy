name: sax_buddy
description: "Offline-first saxophone fingering chart, altissimo explorer, metronome & drone tuner, scales trainer, horn transposer, practice studio, biometric vault, and Google Drive sync app for Android & Desktop."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  cupertino_icons: ^1.0.8
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  http: ^1.6.0
  local_auth: ^3.0.2
  url_launcher: ^6.3.1
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
